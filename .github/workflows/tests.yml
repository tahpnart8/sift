name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # MLRan is not redistributed, so the tests that need the raw dataset skip.
      # The invariants the paper depends on are asserted on synthetic panels and
      # do run here.
      - name: Test
        run: pytest -q
